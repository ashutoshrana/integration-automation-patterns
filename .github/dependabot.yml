version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # The MCP adapter uses the v1 API; v2 requires a separately tested migration.
    ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    labels:
      - "type/dependencies"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "type/dependencies"
    commit-message:
      prefix: "chore"
