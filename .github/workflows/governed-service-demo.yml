name: Governed service demo
on:
  pull_request:
  push:
    branches: [main, codex/reliability-and-adoption-20260911]
permissions:
  contents: read
jobs:
  synthetic-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested source revisions and local telemetry SDK
        run: |
          python -m pip install -e '.[test]' opentelemetry-sdk==1.44.0 \
            'enterprise-rag-patterns @ git+https://github.com/ashutoshrana/enterprise-rag-patterns.git@067d2f20d72aec8b3047c66ac59361745a0e9b77' \
            'regulated-ai-governance @ git+https://github.com/ashutoshrana/regulated-ai-governance.git@664a753aa46062d5e07b0e3a35f8fbf2367a4638' \
            'confidence-escalation @ git+https://github.com/ashutoshrana/confidence-escalation.git@59a9b95497d9a2f5ee3c67f633ad9bc8ff752f71' \
            'voice-ai-governance @ git+https://github.com/ashutoshrana/voice-ai-governance.git@17f37396241ca3a97341cf55d8616b55aa2213c8'
      - name: Verify synthetic workflow and separate-process crash recovery
        run: python -m pytest tests/test_governed_service_demo.py -q
