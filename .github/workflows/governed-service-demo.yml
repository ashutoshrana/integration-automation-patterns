name: Governed service demo
on:
  pull_request:
  push:
    branches: [main, codex/reliability-and-adoption-20260911]
permissions:
  contents: read
jobs:
  synthetic-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested source revisions and local telemetry SDK
        run: |
          python -m pip install -e '.[test]' opentelemetry-sdk==1.44.0 \
            'enterprise-rag-patterns @ git+https://github.com/ashutoshrana/enterprise-rag-patterns.git@0d926d01627c195d449c45f4635d7b13cc7f0056' \
            'regulated-ai-governance @ git+https://github.com/ashutoshrana/regulated-ai-governance.git@664a753aa46062d5e07b0e3a35f8fbf2367a4638' \
            'confidence-escalation @ git+https://github.com/ashutoshrana/confidence-escalation.git@b704ac7c695a65ce5c87cff6ea109de3b75be76a' \
            'voice-ai-governance @ git+https://github.com/ashutoshrana/voice-ai-governance.git@a24efbc61bb76265588ae375d520a7a543fdc38b'
      - name: Verify synthetic workflow and separate-process crash recovery
        run: python -m pytest tests/test_governed_service_demo.py -q
