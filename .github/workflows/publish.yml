name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    name: Validate tagged commit and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate stable tag and source/runtime identity
        run: |
          python scripts/check_release.py --tag "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
      - name: Install verification tools
        run: python -m pip install -e '.[dev]' build twine ruff==0.15.10
      - name: Test the exact tagged commit
        run: |
          python -m pytest tests/ --cov=src --cov-report=term --cov-fail-under=50
          ruff check src/ tests/
          ruff format --check src/ tests/
          mypy src/
      - name: Build and validate distribution metadata
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/check_release.py --tag "$RELEASE_TAG" --dist dist
      - name: Verify clean installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/release-wheel"
          "$RUNNER_TEMP/release-wheel/bin/python" -m pip install --no-deps dist/*.whl
          python scripts/check_release.py --tag "$RELEASE_TAG" --dist dist --installed-python "$RUNNER_TEMP/release-wheel/bin/python"
      - name: Publish validated artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
