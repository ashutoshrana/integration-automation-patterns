name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    name: Build and validate release artifacts
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install hash-locked release build tools
        run: |
          python -m venv "$RUNNER_TEMP/release-tools"
          "$RUNNER_TEMP/release-tools/bin/python" -m pip install --require-hashes -r ci/release-build-requirements.txt
          "$RUNNER_TEMP/release-tools/bin/python" -m pip check
          "$RUNNER_TEMP/release-tools/bin/python" -m pip --version
          "$RUNNER_TEMP/release-tools/bin/python" -m pip list --format=freeze
      - name: Validate stable tag and source/runtime identity
        run: |
          python scripts/check_release.py --tag "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
      - name: Install verification tools
        run: python -m pip install -e '.[dev]' ruff==0.15.10
      - name: Test the exact tagged commit
        run: |
          python -m pytest tests/ --cov=src --cov-report=term --cov-fail-under=50
          ruff check src/ tests/
          ruff format --check src/ tests/
          mypy src/
      - name: Build and validate distribution metadata
        run: |
          "$RUNNER_TEMP/release-tools/bin/python" -m build --no-isolation
          "$RUNNER_TEMP/release-tools/bin/python" -m twine check dist/*
          python scripts/check_release.py --tag "$RELEASE_TAG" --dist dist
      - name: Verify clean installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/release-wheel"
          "$RUNNER_TEMP/release-wheel/bin/python" -m pip install --no-deps dist/*.whl
          python scripts/check_release.py --tag "$RELEASE_TAG" --dist dist --installed-python "$RUNNER_TEMP/release-wheel/bin/python"
      - name: Verify clean installed sdist and dependency consistency
        run: |
          python -m venv "$RUNNER_TEMP/release-sdist"
          "$RUNNER_TEMP/release-sdist/bin/python" -m pip install --require-hashes -r ci/release-build-requirements.txt
          "$RUNNER_TEMP/release-sdist/bin/python" -m pip install --no-build-isolation --no-deps dist/*.tar.gz
          python scripts/check_release.py --tag "$RELEASE_TAG" --dist dist --installed-python "$RUNNER_TEMP/release-sdist/bin/python"
          "$RUNNER_TEMP/release-wheel/bin/python" -m pip check
          "$RUNNER_TEMP/release-sdist/bin/python" -m pip check
      - name: Record verified artifact hashes
        run: sha256sum dist/* > SHA256SUMS
      - name: Upload verified distributions
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release-distributions
          path: |
            dist/*
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download this run's verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: .
          merge-multiple: true
      - name: Verify unchanged artifact bytes
        run: sha256sum --check SHA256SUMS
      - name: Publish distributions and attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
